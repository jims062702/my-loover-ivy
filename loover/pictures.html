<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictures Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background-color: #fff3e0;
            text-align: center;
            padding-top: 80px;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff9800;
            margin: 20px 0;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeIn 1s ease-in-out forwards;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1rem;
            padding: 10px 15px;
            background-color: transparent;
            border: 2px solid #ff9800;
            color: #ff9800;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.3s ease-in-out;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 1s ease-in-out forwards;
        }

        .back-button i {
            margin-right: 8px;
        }

        .back-button:hover {
            background-color: #ff9800;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 90%;
            max-width: 1400px;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease-in-out forwards;
        }

        .image-box {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transition: 0.3s ease-in-out;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            opacity: 0;
            transform: scale(0.9);
            animation: popIn 1s ease-in-out forwards;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s ease-in-out;
        }

        .image-box:hover {
            transform: scale(1.05);
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease-in-out forwards;
        }

        .pagination button {
            font-size: 1rem;
            padding: 8px 15px;
            margin: 5px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pagination button:hover {
            background-color: #f57c00;
            transform: scale(1.1);
        }

        .video-button {
            font-size: 1.3rem;
            padding: 12px 24px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease-in-out forwards;
        }

        .video-button:hover {
            background-color: #f57c00;
            transform: scale(1.1);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <button class="back-button" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Back
    </button>
    

    <h1>Mga Pictures nato loover</h1>

    <div class="gallery" id="gallery"></div>

    <div class="pagination" id="pagination"></div>
    <button class="video-button" onclick="goToPage('videos.html')">Go to Videos</button>
    

    <script>
        const images = [
            "50784753-4c6c-406d-87be-ccf074b0d893.jfif", "380106572_1349898142293942_3512203035170318391_n.jpg",
            "50784753-4c6c-406d-87be-ccf074b0d893.jfif", "image4.jpg", "image5.jpg", "image6.jpg", "image7.jpg", "image8.jpg", "image9.jpg", "image10.jpg",
            "image11.jpg", "image12.jpg", "image13.jpg", "image14.jpg", "image15.jpg", "image16.jpg", "image17.jpg", "image18.jpg",
            "image19.jpg", "image20.jpg", "image21.jpg", "image22.jpg", "image23.jpg", "image24.jpg", "image25.jpg"
        ];
        const imagesPerPage = 12;
        let currentPage = 1;

        function displayImages() {
            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";
            const start = (currentPage - 1) * imagesPerPage;
            const end = start + imagesPerPage;
            
            images.slice(start, end).forEach((img, index) => {
                const div = document.createElement("div");
                div.className = "image-box";
                div.innerHTML = `<img src="${img}" alt="Memory">`;
                div.onclick = () => goToPage(`feeling${start + index + 1}.html`);
                gallery.appendChild(div);
            });
        }

        function setupPagination() {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";
            const totalPages = Math.ceil(images.length / imagesPerPage);
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; displayImages(); setupPagination(); };
                if (i === currentPage) btn.style.backgroundColor = "#f57c00";
                pagination.appendChild(btn);
            }
        }

        function goBack() {
            window.history.back();
        }

        function goToPage(page) {
            window.location.href = page;
        }

        displayImages();
        setupPagination();
    </script>
</body>
</html>
