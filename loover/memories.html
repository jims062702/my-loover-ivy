<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memories</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff3e0;
      padding: 1rem;
      text-align: center;
      position: relative;
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
      min-height: 100vh;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: #ff9800;
      margin-bottom: 2rem;
      margin-top: 5rem;
    }

    .back-button {
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-size: 1rem;
      padding: 0.6rem 1.1rem;
      background-color: transparent;
      border: 2px solid #ff9800;
      color: #ff9800;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.3s ease-in-out;
    }

    .back-button i {
      margin-right: 0.5rem;
    }

    .back-button:hover {
      background-color: #ff9800;
      color: #fff;
    }

    .memory-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      padding-bottom: 3rem;
    }

    .memory-box {
      width: min(90vw, 350px);
      height: 400px;
      border: 4px solid rgba(255, 152, 0, 0.7);
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .memory-box:hover {
      transform: scale(1.05);
      border-color: #ff9800;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .memory-box img,
    .memory-box video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(3px) brightness(0.7);
      transition: filter 0.3s ease;
    }

    .memory-box:hover img,
    .memory-box:hover video {
      filter: blur(2px) brightness(0.9);
    }

    .category-button {
      font-size: clamp(1rem, 4vw, 1.5rem);
      padding: 0.8rem 2rem;
      background-color: rgba(255, 255, 255, 0.3);
      border: 3px solid #fff;
      color: #fff;
      border-radius: 10px;
      backdrop-filter: blur(2px);
      z-index: 1;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .category-button:hover {
      background-color: rgba(255, 255, 255, 0.5);
      transform: scale(1.1);
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #ff9800;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .memory-box {
        height: 300px;
      }
      .category-button {
        padding: 0.6rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading">
    <div class="loader"></div>
  </div>

  <!-- Back Button -->
  <button class="back-button" onclick="goBack()">
    <i class="fas fa-arrow-left"></i> Back
  </button>

  <h1>Our Special Memories</h1>

  <div class="memory-container">
    <div class="memory-box" onclick="goToPage('pictures.html')">
      <img src="50784753-4c6c-406d-87be-ccf074b0d893.jfif" alt="Memory Picture">
      <button class="category-button">Pictures</button>
    </div>
    <div class="memory-box" onclick="goToPage('videos.html')">
      <video src="9b3afe64-740c-4ebf-a043-b5a753ff80f2.mp4" autoplay muted loop></video>
      <button class="category-button">Videos</button>
    </div>
  </div>

  <script>
    window.onload = () => {
      document.getElementById("loading").style.display = "none";
    };

    function goBack() {
      document.getElementById("loading").style.display = "flex";
      setTimeout(() => {
        window.history.back();
      }, 1500);
    }

    function goToPage(page) {
      document.getElementById("loading").style.display = "flex";
      setTimeout(() => {
        window.location.href = page;
      }, 1500);
    }
  </script>
</body>
</html>
